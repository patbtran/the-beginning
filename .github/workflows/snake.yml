name: Generate GitHub Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: patbtran
          outputs: |
            dist/github-snake.svg?palette=github-dark

      - name: Upload snake artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-snake
          path: dist/github-snake.svg
  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download snake artifact
        uses: actions/download-artifact@v4
        with:
          name: github-snake
          path: dist
          
      - name: Publish contribution snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
